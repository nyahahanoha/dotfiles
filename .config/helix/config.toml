theme = "dracula_transparent"

[editor]
true-color = true
clipboard-provider = "pasteboard"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.whitespace.render]
space = "all"
tab = "all"
newline = "all"

[editor.whitespace.characters]
space = " "

#[editor.indent]
#tab-width = 2

[editor.inline-diagnostics]
cursor-line = "hint"

