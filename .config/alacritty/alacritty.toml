[env]
TERM = "xterm-256color"

[font]
size = 18.0

[font.bold]
family = "MesloLGS NF"
style = "Bold"

[font.bold_italic]
family = "MesloLGS NF"
style = "Bold Italic"

[font.italic]
family = "MesloLGS NF"
style = "Italic"

[font.normal]
family = "MesloLGS NF"
style = "Regular"

[general]
import = ["~/.config/alacritty/aura.toml"]

[window]
decorations = "none"
opacity = 0.70
startup_mode = "Maximized"

[window.padding]
x = 3
y = 1
